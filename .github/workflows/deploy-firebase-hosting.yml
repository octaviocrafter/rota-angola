name: Deploy ROTA to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Publicar no Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: rota-angola
          channelId: live
          entryPoint: .

      # As regras Firestore são independentes do Hosting e precisam de deploy explícito.
      - name: Autenticar Google Cloud para Firestore
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      - name: Publicar regras Firestore
        run: npx --yes firebase-tools@13 deploy --only firestore:rules --project rota-angola --non-interactive
