name: Deploy ROTA to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Publicar no Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: rota-angola
          channelId: live
          entryPoint: .

      # As regras Firestore são independentes do Hosting e precisam de deploy explícito.
      - name: Publicar regras Firestore
        uses: w9jds/firebase-action@v13
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        with:
          args: deploy --only firestore:rules --project rota-angola
