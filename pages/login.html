<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f"><link rel="manifest" href="../manifest.json"><link rel="stylesheet" href="../css/style.css">
  <title>Entrar — ROTA</title>
</head>
<body>
  <!-- LOGIN: esta página usa Firebase Authentication e não guarda palavras-passe no Firestore. -->
  <header class="topbar"><a class="brand" href="../"><img class="brand-mark-img" src="../assets/img/logo-aplicacao.jpg" alt="Logótipo ROTA"><span><strong>ROTA</strong><small>Só rota e segurança.</small></span></a><div class="top-actions"><button class="icon-btn" data-theme-toggle>☼</button><a class="text-btn" href="../">Início</a></div></header>
  <main class="shell">
    <a class="text-btn" href="../">← Voltar ao início</a>
    <section class="hero"><div class="eyebrow">ROTA · acesso</div><h1>Entre na sua conta.</h1><p>Use o mesmo e-mail e palavra-passe utilizados no cadastro. O ROTA abre automaticamente o painel correspondente ao seu perfil.</p></section>
    <form class="search-card form-grid" data-login-form>
      <label>E-mail<input name="email" type="email" required autocomplete="username" placeholder="nome@exemplo.com"></label>
      <label>Palavra-passe<input name="password" type="password" required autocomplete="current-password" placeholder="A sua palavra-passe"></label>
      <button class="btn btn-primary" type="submit">Entrar →</button><button class="btn btn-ghost" type="button" data-reset-password>Esqueci-me da palavra-passe</button>
      <div class="safety-strip"><span class="safety-icon">✓</span><div><strong>Não tem conta?</strong><span><a href="cadastro-passageiro.html">Criar conta de passageiro</a> ou <a href="cadastro-motorista.html">criar conta de motorista</a>.</span></div></div>
    </form>
  </main>
  <script src="../js/app.js"></script><script type="module" src="../js/auth.js"></script><script src="../js/install.js"></script>
</body>
</html>
